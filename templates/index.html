<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f3f5;
        }

        .login-card {
            width: 475px;
            background: white;
            padding: 42px 40px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        .login-card h1 {
            margin: 0 0 28px;
            text-align: center;
            font-size: 30px;
            color: #263238;
        }

        .alert {
            padding: 14px 16px;
            margin-bottom: 25px;
            border-radius: 5px;
            text-align: center;
            font-size: 16px;
        }

        .alert.success {
            color: #155724;
            background: #d4edda;
            border: 1px solid #c3e6cb;
        }

        .alert.danger {
            color: #721c24;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;
            font-size: 17px;
            color: #37474f;
        }

        .form-group input {
            width: 100%;
            height: 44px;
            padding: 10px 12px;
            border: 1px solid #d0d7de;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #1976d2;
            box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.12);
        }

        .btn-login {
            width: 100%;
            height: 50px;
            margin-top: 3px;
            border: none;
            border-radius: 5px;
            background: #0875d1;
            color: white;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-login:hover {
            background: #0868b9;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h1>Portal Login</h1>

        {% if message %}
            <div class="alert {{ status_class }}">
                {{ message }}
            </div>
        {% endif %}

        <form method="POST" action="/">
            <div class="form-group">
                <label for="username">Nama Pengguna</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Kata Sandi</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </div>

            <button type="submit" class="btn-login">
                Masuk
            </button>
        </form>
    </div>

</body>
</html>
