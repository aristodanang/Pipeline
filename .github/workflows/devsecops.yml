name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]

  pull_request:
    branches: ["main", "master"]

  workflow_dispatch: {}

jobs:

  # ==========================================
  # CI JOB 1: SAST Scan (Semgrep)
  # ==========================================
  sast-scan:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: semgrep scan --config auto --error --verbose --exclude=".github"


  # ==========================================
  # CI JOB 2: Code Quality (Pylint) & SCA (Pip-Audit)
  # ==========================================
  pylint-check:
    name: Pylint Code Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies & Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install pylint pip-audit
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          export PYTHONPATH="."
          python -m unittest discover -s tests

      - name: Run Pylint Check
        run: pylint --fail-under=9.0 app.py

      - name: Run Pip-Audit SCA
        run: pip-audit -r requirements.txt


  # ==========================================
  # CI JOB 3: Aqua Trivy Security Scan (Filesystem & Secret)
  # ==========================================
  trivy-scan:
    name: Aqua Trivy Security & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Aqua Trivy Vulnerability & Secret Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "0"


  # ==========================================
  # CD STAGE: Deploy ke VM (Docker Standalone)
  # ==========================================
  deploy-to-vm:
    name: Build & Deploy to VM (Docker Standalone)

    needs: [sast-scan, pylint-check, trivy-scan]

    runs-on: self-hosted

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Container Image
        run: |
          docker build -t secure-flask-app:latest .

      - name: Deploy Standalone Docker Container
        run: |
          docker stop web-flask || true
          docker rm web-flask || true
          docker run -d --restart unless-stopped -p 5000:5000 --name web-flask secure-flask-app:latest
          docker ps | grep web-flask
